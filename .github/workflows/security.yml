# On every push / pull request and every Monday:
#   * scan the Python dependencies for known vulnerabilities (pip-audit)
#   * scan the git history for leaked secrets (gitleaks)
#   * run the test suite (includes the security tests)
name: Security and tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petrol_station
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit
      - name: Scan dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Run tests
        run: python -m pytest -q tests -p no:cacheprovider
      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
