<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Change password</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="shell" id="shell">
    <div class="main">
      <main class="content">
        <div class="card" style="max-width:520px">
          <h1>Change password</h1>
          <div id="first-login" class="banner banner--warn hidden">
            <div class="banner__icon">🔑</div>
            <div class="banner__body"><h2>Please set your own password</h2>
              <p>You are using a temporary password. Choose a new one before continuing.</p></div>
          </div>
          <form id="pw-form" class="stack" novalidate>
            <div class="field">
              <label for="current_password">Current (temporary) password</label>
              <input class="input" type="password" id="current_password" name="current_password" autocomplete="current-password" required>
            </div>
            <div class="field">
              <label for="new_password">New password</label>
              <input class="input" type="password" id="new_password" name="new_password" autocomplete="new-password" data-password required>
              <span class="hint">At least 8 characters, with letters and numbers.</span>
            </div>
            <div class="field">
              <label for="confirm_password">Repeat new password</label>
              <input class="input" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" data-match="new_password" required>
            </div>
            <button class="btn btn--primary btn--lg btn--block" type="submit">Save new password</button>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/pages/change-password.js"></script>
</body>
</html>
